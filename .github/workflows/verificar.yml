name: Verificar
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JSON válidos
        run: for f in $(find public/data -name '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: Cálculo litúrgico
        run: node scripts/probar_calendario.mjs
